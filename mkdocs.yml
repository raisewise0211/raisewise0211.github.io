site_name: Robotics Notes
site_url: https://raisewise0211.github.io

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css
  - stylesheets/fonts.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.datatables.net/2.1.8/js/dataTables.min.js
  - javascripts/tables.js

nav:
  - Home: index.md
  - Math:
    - Overview: math/index.md
    - Linear Algebra:
      - 벡터와 행렬: math/linear-algebra/vector-matrix.md
    - Kinematics:
      - Overview: math/kinematics/index.md
      - 모바일 로봇 기구학: math/kinematics/mobile-robot.md
  - Papers:
    - Overview: papers/index.md
    - MAPF:
      - Overview: papers/mapf/index.md
      - LaCAM: papers/mapf/lacam.md
      - PIBT: papers/mapf/pibt.md
    - VLA:
      - Overview: papers/vla/index.md
      - OpenVLA: papers/vla/openvla.md
  - ROS2:
    - Overview: ros2/index.md
    - DDS:
      - 세션 1 - 왜 DDS인가?: ros2/dds/session-01-why-dds.md
      - 세션 2 - DCPS & Discovery: ros2/dds/session-02-dcps-discovery.md
    - Nav2:
      - MPPI Controller: ros2/nav2/mppi-controller.md
      - Lifecycle Manager: ros2/nav2/lifecycle-manager.md
    - Isaac ROS Cloud Control:
      - Overview: ros2/cloud-control/index.md
      - Mission Client: ros2/cloud-control/mission-client.md
      - Action Handlers: ros2/cloud-control/action-handlers.md
      - MQTT Bridge: ros2/cloud-control/mqtt-bridge.md
      - 보조 패키지: ros2/cloud-control/supporting-packages.md

